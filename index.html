<script src="./data.js"＞＜/script>
<script>
(function downloadNewIndexHtml() {
  var LT = String.fromCharCode(60);
  var GT = String.fromCharCode(62);
  function T(s) { return s.replace(/«/g, LT).replace(/»/g, GT); }

  function mainAppScript() {
    var LT = String.fromCharCode(60);
    var GT = String.fromCharCode(62);
    var AMP = String.fromCharCode(38);
    var LT_REG = new RegExp(LT, "g");
    var GT_REG = new RegExp(GT, "g");

    function T(s) { return s.replace(/«/g, LT).replace(/»/g, GT); }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, AMP + "amp;")
        .replace(/"/g, AMP + "quot;")
        .replace(/'/g, AMP + "#39;")
        .replace(LT_REG, AMP + "lt;")
        .replace(GT_REG, AMP + "gt;")
        .replace(/«/g, AMP + "lt;")
        .replace(/»/g, AMP + "gt;");
    }

    var ttPolicy = null;
    if (window.trustedTypes && window.trustedTypes.createPolicy) {
      try {
        ttPolicy = window.trustedTypes.defaultPolicy || window.trustedTypes.createPolicy("default", {
          createHTML: function(s) { return s; }
        });
      } catch (e) {
        try {
          ttPolicy = window.trustedTypes.createPolicy("pogoLocalTemplatePolicy", {
            createHTML: function(s) { return s; }
          });
        } catch (e2) {}
      }
    }
    function renderTemplate(el, templateStr) {
      var html = T(templateStr);
      el.innerHTML = ttPolicy ? ttPolicy.createHTML(html) : html;
    }

    var DATA = window.POGO_DATA;
    if (!DATA) {
      document.body.textContent = "載入失敗：找不到 data.js，請確認 data.js 與 index.html 放在同一個 GitHub 資料夾內。";
      return;
    }

    var FAMILIES = DATA.FAMILIES;
    var COLLECTIONS = DATA.COLLECTIONS;
    var DITTO_NT_BASE = DATA.DITTO_BASE;
    var PM_ADDR_BASE = "https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Pokemon%20-%20256x256/Addressable%20Assets/";
    var PM_ICON_BASE = "https://raw.githubusercontent.com/PokeMiners/pogo_assets/master/Images/Pokemon%20-%20256x256/";

    var toastTimer = null;
    function showToast(msg) {
      var el = document.getElementById("toastMsg");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove("show"); }, 2800);
    }

    function warnLockedByShiny() {
      showToast("✨ 此背卡已由「色背」自動連動解鎖！若要取消，請切換至色背模式操作。");
    }

    // 載入並管理所有卡冊的獨立存檔
    var statesByCol = {};
    var storageAvailable = true;
    var resolvedBgByCol = {};

    COLLECTIONS.forEach(function(col) {
      statesByCol[col.id] = {};
      try {
        var raw = localStorage.getItem(col.storageKey);
        if (raw) statesByCol[col.id] = JSON.parse(raw);
      } catch (e) {
        storageAvailable = false;
      }

      // 針對 single-bg 卡冊，自動從候選網址中探測第一個可用的背卡底圖
      if (col.bgCandidates && col.bgCandidates.length) {
        resolvedBgByCol[col.id] = col.bgCandidates[0];
        (function probeBg(c, idx) {
          if (idx >= c.bgCandidates.length) return;
          var img = new Image();
          img.onload = function() {
            resolvedBgByCol[c.id] = c.bgCandidates[idx];
            var bgEls = document.querySelectorAll("[data-col-bg='" + c.id + "']");
            Array.prototype.forEach.call(bgEls, function(el) {
              el.style.backgroundImage = "url('" + c.bgCandidates[idx] + "')";
            });
          };
          img.onerror = function() { probeBg(c, idx + 1); };
          img.src = c.bgCandidates[idx];
        })(col, 0);
      } else if (col.coverBg) {
        resolvedBgByCol[col.id] = col.coverBg;
      }
    });

    var currentColId = null; // null 代表目前在「🏠 首頁卡冊大廳」
    var filter = "ALL", query = "", allNormalToggle = false;
    var activeModalItemId = null, activeModalFamily = null;

    function getCol(colId) {
      return COLLECTIONS.find(function(c) { return c.id === colId; });
    }

    function getItemState(colId, itemId) {
      var colState = statesByCol[colId];
      if (!colState[itemId]) colState[itemId] = { isNormal: false };
      return colState[itemId];
    }

    function saveColState(colId) {
      if (!storageAvailable) return;
      var col = getCol(colId);
      if (!col) return;
      try {
        localStorage.setItem(col.storageKey, JSON.stringify(statesByCol[colId]));
      } catch (e) {
        showToast("⚠️ 儲存空間不足或遭封鎖，變更無法保存。");
      }
    }

    function isStageShinyOwned(st, baseKey) { return !!st[baseKey]; }
    function isStageCardOwned(st, baseKey) { return !!(st[baseKey] || st["n_" + baseKey]); }
    function isStageOwnedInView(st, baseKey, isNormalView) {
      return isNormalView ? isStageCardOwned(st, baseKey) : isStageShinyOwned(st, baseKey);
    }

    function isFamilyOwnedInView(st, famKey, isNormalView) {
      return FAMILIES[famKey].stages.some(function(p) {
        return isStageOwnedInView(st, p.key, isNormalView);
      });
    }

    function isFamilyAllOwnedInView(st, famKey, isNormalView) {
      return FAMILIES[famKey].stages.every(function(p) {
        return isStageOwnedInView(st, p.key, isNormalView);
      });
    }

    function padDexNumber(dex) {
      return String(dex).padStart(3, "0");
    }

    function pogoImgHtml(dex, isShiny, altName, extraCls) {
      var addrUrl = PM_ADDR_BASE + "pm" + dex + (isShiny ? ".s" : "") + ".icon.png";
      var legacyUrl = PM_ICON_BASE + "pokemon_icon_" + padDexNumber(dex) + "_00" + (isShiny ? "_shiny" : "") + ".png";
      var cls = "poke-img" + (extraCls ? (" " + extraCls) : "");
      return "«img class='" + cls + "' src='" + escapeHtml(addrUrl) + "' data-fallback='" + escapeHtml(legacyUrl) + "' alt='" + escapeHtml(altName) + "'»";
    }

    function bindImgFallbacks(container) {
      var imgs = container.querySelectorAll("img[data-fallback]");
      Array.prototype.forEach.call(imgs, function(img) {
        img.addEventListener("error", function() {
          var fb = img.getAttribute("data-fallback");
          if (fb && img.src !== fb) img.src = fb;
        }, { once: true });
      });
    }

    // 計算任一卡冊的統計數據 (供首頁大廳與內頁共用)
    function computeCollectionStats(col) {
      var shinyTotal = 0, cardTotal = 0, maxCards = 0;
      var subA = 0, subB = 0;
      if (col.type === "multi-location") {
        maxCards = col.locations.length * 2;
        col.locations.forEach(function(loc) {
          var st = getItemState(col.id, loc.id);
          var raidFam = col.zoneToFamily[loc.zone];
          var tSh = isFamilyOwnedInView(st, "treecko", false);
          var rSh = isFamilyOwnedInView(st, raidFam, false);
          if (tSh) { shinyTotal++; subA++; }
          if (rSh) { shinyTotal++; subB++; }
          if (isFamilyOwnedInView(st, "treecko", true)) cardTotal++;
          if (isFamilyOwnedInView(st, raidFam, true)) cardTotal++;
        });
      } else {
        maxCards = col.roster.length;
        col.roster.forEach(function(r) {
          var st = getItemState(col.id, r.id);
          if (isFamilyOwnedInView(st, r.fam, false)) shinyTotal++;
          if (isFamilyOwnedInView(st, r.fam, true)) cardTotal++;
        });
      }
      return { shinyTotal: shinyTotal, cardTotal: cardTotal, maxCards: maxCards, subA: subA, subB: subB };
    }

    function buildDotsHtml(st, famKey) {
      var fam = FAMILIES[famKey];
      var dots = fam.stages.map(function(p) {
        var shOwned = isStageShinyOwned(st, p.key);
        var cardOwned = isStageCardOwned(st, p.key);
        var cls = !st.isNormal ? (shOwned ? "on-sh" : "") : (shOwned ? "on-sh" : (cardOwned ? "on" : ""));
        return "«span class='evo-dot " + cls + "' title='" + escapeHtml(p.name) + "'»«/span»";
      }).join("");
      return "«span class='evo-dots' aria-hidden='true'»" + dots + "«/span»";
    }

    // 建立單張寶可夢背卡 HTML
    function buildPokeCardHtml(col, itemId, stampText, bgUrl, famKey, isOwned, unlockedByShinyInNorm, isShiny, dotsHtml, showModeBtnInCard) {
      var fam = FAMILIES[famKey];
      var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«span class='sp3'»✦«/span»«/div»" : "";
      var badgeText = isOwned ? (unlockedByShinyInNorm ? "✨ 色背已連動" : "✓ 已擁有") : "+ 點此打勾";
      var badgeExtraCls = unlockedByShinyInNorm ? "from-shiny" : "";
      var bgAttr = col.type === "single-bg" ? (" data-col-bg='" + escapeHtml(col.id) + "'") : "";
      var modeTagHtml = showModeBtnInCard
        ? "«button type='button' class='ver-tag-btn " + (isShiny ? "" : "norm") + "' data-action='toggle-mode' data-id='" + escapeHtml(itemId) + "' title='切換此卡色背/普背'»" + (isShiny ? "✨ 色背 🔄" : "普背 🔄") + "«/button»"
        : "«span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + (isShiny ? "✨ 色背" : "普背") + "«/span»";

      return [
        "«div class='pogo-card " + (isOwned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "'»",
        "  «div class='bg-layer'" + bgAttr + " style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
        sparkleHtml,
        "  «div class='card-top'»",
             modeTagHtml,
        "    «button type='button' class='own-badge " + badgeExtraCls + "' aria-pressed='" + (isOwned ? "true" : "false") + "' data-action='quick-toggle' data-id='" + escapeHtml(itemId) + "' data-fam='" + escapeHtml(famKey) + "'»" + badgeText + "«/button»",
        "  «/div»",
        "  «div class='card-preview-trigger' role='button' tabindex='0' data-action='open-modal' data-id='" + escapeHtml(itemId) + "' data-fam='" + escapeHtml(famKey) + "'»",
        "    «div class='poke-layer'»",
               pogoImgHtml(fam.baseDex, isShiny, fam.baseName),
        "    «/div»",
        "    «div class='loc-stamp'»",
        "      «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(fam.baseName) + " " + dotsHtml + "«/div»",
        "      «div class='stamp-pill'»📍 " + escapeHtml(stampText) + "«/div»",
        "      «div class='evo-hint'»" + escapeHtml(fam.baseName) + " 🧬進化鏈«/div»",
        "    «/div»",
        "  «/div»",
        "«/div»"
      ].join("");
    }

    // 渲染畫面（自動判斷要畫「首頁大廳」還是「卡冊內頁」）
    function render() {
      var appRoot = document.getElementById("appRoot");
      if (!currentColId) {
        renderHomeView(appRoot);
      } else {
        renderCollectionView(appRoot, getCol(currentColId));
      }
    }

    // 🏠 渲染首頁卡冊大廳
    function renderHomeView(container) {
      var grandShiny = 0, grandCard = 0, grandMax = 0;
      var albumCardsHtml = COLLECTIONS.map(function(col) {
        var st = computeCollectionStats(col);
        grandShiny += st.shinyTotal;
        grandCard += st.cardTotal;
        grandMax += st.maxCards;
        var pct = st.maxCards ? Math.round(st.shinyTotal / st.maxCards * 100) : 0;
        var bgUrl = resolvedBgByCol[col.id] || col.coverBg || "";
        var pokesHtml = (col.coverPokes || []).map(function(dex) {
          return pogoImgHtml(dex, true, "封面寶可夢", "album-poke");
        }).join("");

        return [
          "«div class='album-card' role='button' tabindex='0' data-action='open-col' data-col='" + escapeHtml(col.id) + "'»",
          "  «div class='album-visual' data-col-bg='" + escapeHtml(col.id) + "' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»",
          "    «span class='album-tag'»" + escapeHtml(col.tag) + "«/span»",
          "    «div class='album-pokes'»" + pokesHtml + "«/div»",
          "  «/div»",
          "  «div class='album-body'»",
          "    «div class='album-title'»" + escapeHtml(col.title) + "«/div»",
          "    «div class='album-sub'»" + escapeHtml(col.subtitle) + "«/div»",
          "    «div class='prog-wrap'»",
          "      «div class='prog-text'»",
          "        «span»✨ 色背 " + st.shinyTotal + " / " + st.maxCards + " (" + pct + "%)«/span»",
          "        «span»🎴 背卡 " + st.cardTotal + " / " + st.maxCards + "«/span»",
          "      «/div»",
          "      «div class='bar-bg'»«div class='bar-fill' style='width:" + pct + "%;'»«/div»«/div»",
          "    «/div»",
          "    «div class='album-enter'»點此進入卡冊 ➔«/div»",
          "  «/div»",
          "«/div»"
        ].join("");
      }).join("");

      var grandPct = grandMax ? Math.round(grandShiny / grandMax * 100) : 0;

      renderTemplate(container, [
        "«header»",
        "  «h1»✨ Pokémon GO 背卡收藏總圖鑑«/h1»",
        "  «div class='sub-header'»選擇下方活動卡冊進入打勾｜所有進度自動獨立保存在本機瀏覽器«/div»",
        "  «div class='prog-wrap'»",
        "    «div class='prog-text'»",
        "      «span»🏆 全站總色背進度：" + grandShiny + " / " + grandMax + " (" + grandPct + "%)«/span»",
        "      «span»🎴 全站背卡總收藏：" + grandCard + " / " + grandMax + "«/span»",
        "    «/div»",
        "    «div class='bar-bg'»«div class='bar-fill' style='width:" + grandPct + "%;'»«/div»«/div»",
        "  «/div»",
        "«/header»",
        "«main class='albums-grid'»" + albumCardsHtml + "«/main»"
      ].join(""));

      bindImgFallbacks(container);
    }

    // 📖 渲染單一卡冊內頁
    function renderCollectionView(container, col) {
      var stats = computeCollectionStats(col);
      var pct = stats.maxCards ? Math.round(stats.shinyTotal / stats.maxCards * 100) : 0;
      var rightStatText = col.type === "multi-location"
        ? ("🌿 色背木守宮 " + stats.subA + "/27 ｜ ⚔️ 色背團體戰 " + stats.subB + "/27")
        : ("📍 地標印章：" + col.locStamp);

      var filterBtnsHtml = col.filters.map(function(f) {
        var act = (filter === f.key) ? " active" : "";
        return "«button type='button' class='btn" + act + "' data-action='set-filter' data-z='" + escapeHtml(f.key) + "'»" + escapeHtml(f.label) + "«/button»";
      }).join("");

      var cardsAreaHtml = "";
      if (col.type === "multi-location") {
        // 模式 A：National Trust 雙卡地標框模式
        var boxes = [];
        col.locations.forEach(function(loc) {
          var st = getItemState(col.id, loc.id);
          var raidFamKey = col.zoneToFamily[loc.zone];
          var tShiny = isFamilyOwnedInView(st, "treecko", false);
          var rShiny = isFamilyOwnedInView(st, raidFamKey, false);
          if (filter === "MISS" && (tShiny && rShiny)) return;
          if (["ALL", "MISS"].indexOf(filter) === -1 && loc.zone !== filter) return;
          var searchable = (loc.id + " " + loc.eng + " " + loc.zh + " " + loc.county).toLowerCase();
          if (query && searchable.indexOf(query) === -1) return;

          var isShiny = !st.isNormal;
          var tOwnedView = isFamilyOwnedInView(st, "treecko", st.isNormal);
          var rOwnedView = isFamilyOwnedInView(st, raidFamKey, st.isNormal);
          var bgUrl = DITTO_NT_BASE + loc.slug + ".png";
          var stamp = loc.eng + " • " + loc.county;

          var cardT = buildPokeCardHtml(col, loc.id, stamp, bgUrl, "treecko", tOwnedView, (st.isNormal && tShiny), isShiny, buildDotsHtml(st, "treecko"), false);
          var cardR = buildPokeCardHtml(col, loc.id, stamp, bgUrl, raidFamKey, rOwnedView, (st.isNormal && rShiny), isShiny, buildDotsHtml(st, raidFamKey), false);

          boxes.push([
            "«div class='set-box'»",
            "  «div class='set-header'»",
            "    «div class='set-title-wrap'»",
            "      «div class='set-eng'»«span class='set-id'»" + escapeHtml(loc.id) + "«/span» " + escapeHtml(loc.eng) + "«/div»",
            "      «div class='set-zh'»" + escapeHtml(loc.zh) + " (" + escapeHtml(loc.county) + ")«/div»",
            "    «/div»",
            "    «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(loc.id) + "'»",
                   (isShiny ? "🔄 切換普背" : "✨ 切換色背"),
            "    «/button»",
            "  «/div»",
            "  «div class='pair-grid'»" + cardT + cardR + "«/div»",
            "«/div»"
          ].join(""));
        });
        cardsAreaHtml = "«main class='sets-grid' id='grid'»" + boxes.join("") + "«/main»";
      } else {
        // 模式 B：GO Tour 台南/洛杉磯 單一背景全角色展開模式
        var singleCards = [];
        var bgUrl = resolvedBgByCol[col.id] || "";
        col.roster.forEach(function(r) {
          var st = getItemState(col.id, r.id);
          var fam = FAMILIES[r.fam];
          var shOwned = isFamilyOwnedInView(st, r.fam, false);
          if (filter === "MISS" && shOwned) return;
          if (["ALL", "MISS"].indexOf(filter) === -1 && r.zone !== filter) return;
          var searchable = (r.id + " " + fam.baseName + " " + r.fam + " " + r.note).toLowerCase();
          if (query && searchable.indexOf(query) === -1) return;

          var isShiny = !st.isNormal;
          var ownedView = isFamilyOwnedInView(st, r.fam, st.isNormal);
          singleCards.push(
            buildPokeCardHtml(col, r.id, col.locStamp + "｜" + r.note, bgUrl, r.fam, ownedView, (st.isNormal && shOwned), isShiny, buildDotsHtml(st, r.fam), true)
          );
        });
        cardsAreaHtml = "«main class='single-poke-grid' id='grid'»" + singleCards.join("") + "«/main»";
      }

      renderTemplate(container, [
        "«header»",
        "  «div class='nav-bar'»",
        "    «button type='button' class='back-home-btn' data-action='go-home'»⬅️ 返回首頁大廳«/button»",
        "    «span class='col-badge'»" + escapeHtml(col.tag) + "«/span»",
        "  «/div»",
        "  «h1»" + escapeHtml(col.title) + "«/h1»",
        "  «div class='sub-header'»" + escapeHtml(col.subtitle) + "«/div»",
        "  «div class='prog-wrap'»",
        "    «div class='prog-text'»",
        "      «span id='st-loc'»✨ 色背進度：" + stats.shinyTotal + " / " + stats.maxCards + " (" + pct + "%) ｜ 🎴 背卡收藏：" + stats.cardTotal + " / " + stats.maxCards + "«/span»",
        "      «span id='st-det'»" + escapeHtml(rightStatText) + "«/span»",
        "    «/div»",
        "    «div class='bar-bg'»«div class='bar-fill' style='width:" + pct + "%;'»«/div»«/div»",
        "  «/div»",
        "«/header»",
        "«div class='toolbar'»",
        "  «input type='search' id='q' class='search' value='" + escapeHtml(query) + "' placeholder='🔍 搜尋寶可夢或地名...'»",
           filterBtnsHtml,
        "  «button type='button' class='btn btn-global-mode' data-action='global-mode'»" + (allNormalToggle ? "✨ 全場切色背" : "🔄 全場切普背") + "«/button»",
        "«/div»",
        cardsAreaHtml
      ].join(""));

      var qInput = document.getElementById("q");
      if (qInput) {
        qInput.addEventListener("input", function(e) {
          query = e.target.value.trim().toLowerCase();
          render();
          var newQ = document.getElementById("q");
          if (newQ) { newQ.focus(); newQ.setSelectionRange(newQ.value.length, newQ.value.length); }
        });
      }

      bindImgFallbacks(container);
    }

    // 渲染進化鏈彈出視窗
    function renderModalContent(itemId, famKey) {
      var col = getCol(currentColId);
      if (!col) return;
      var st = getItemState(col.id, itemId);
      var isShiny = !st.isNormal;
      var fam = FAMILIES[famKey];
      var allOwned = isFamilyAllOwnedInView(st, famKey, st.isNormal);

      var titlePrefix = "";
      var bgUrl = "";
      var stampText = "";

      if (col.type === "multi-location") {
        var loc = col.locations.find(function(x) { return x.id === itemId; });
        if (!loc) return;
        titlePrefix = loc.eng + " (" + loc.zh + ")";
        bgUrl = DITTO_NT_BASE + loc.slug + ".png";
        stampText = loc.eng;
      } else {
        titlePrefix = col.title;
        bgUrl = resolvedBgByCol[col.id] || "";
        stampText = col.locStamp;
      }

      var stageCardsHtml = fam.stages.map(function(p) {
        var shOwned = isStageShinyOwned(st, p.key);
        var owned = isStageOwnedInView(st, p.key, st.isNormal);
        var linkedFromShiny = st.isNormal && shOwned;
        var badgeText = owned ? (linkedFromShiny ? "✨ 色背已連動" : "✓ 已擁有") : "點擊打勾";
        var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«/div»" : "";
        return [
          "«div class='pogo-card " + (owned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "' role='button' tabindex='0' aria-pressed='" + (owned ? "true" : "false") + "' data-action='toggle-stage' data-id='" + escapeHtml(itemId) + "' data-stage='" + escapeHtml(p.key) + "'»",
          "  «div class='bg-layer' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
          sparkleHtml,
          "  «div class='card-top'»",

    // 互動操作函式群
    function quickToggleFamily(itemId, famKey) {
      var st = getItemState(currentColId, itemId);
      var fam = FAMILIES[famKey];
      if (!st.isNormal) {
        var anyShiny = isFamilyOwnedInView(st, famKey, false);
        if (anyShiny) {
          fam.stages.forEach(function(p) { st[p.key] = false; });
        } else {
          st[fam.stages[0].key] = true;
        }
      } else {
        if (isFamilyOwnedInView(st, famKey, false)) {
          warnLockedByShiny();
          return;
        }
        var anyNorm = isFamilyOwnedInView(st, famKey, true);
        if (anyNorm) {
          fam.stages.forEach(function(p) { st["n_" + p.key] = false; });
        } else {
          st["n_" + fam.stages[0].key] = true;
        }
      }
      saveColState(currentColId);
      render();
    }

    function toggleStageOwn(itemId, baseKey) {
      var st = getItemState(currentColId, itemId);
      if (!st.isNormal) {
        st[baseKey] = !st[baseKey];
      } else {
        if (st[baseKey]) {
          warnLockedByShiny();
          return;
        }
        var nk = "n_" + baseKey;
        st[nk] = !st[nk];
      }
      saveColState(currentColId);
      render();
      if (activeModalItemId === itemId && activeModalFamily) renderModalContent(itemId, activeModalFamily);
    }

    function toggleAllStagesInModal(itemId, famKey) {
      var st = getItemState(currentColId, itemId);
      var fam = FAMILIES[famKey];
      var all = isFamilyAllOwnedInView(st, famKey, st.isNormal);
      if (!st.isNormal) {
        fam.stages.forEach(function(p) { st[p.key] = !all; });
      } else {
        if (all && isFamilyOwnedInView(st, famKey, false)) warnLockedByShiny();
        fam.stages.forEach(function(p) { st["n_" + p.key] = !all; });
      }
      saveColState(currentColId);
      render();
      if (activeModalItemId === itemId && activeModalFamily === famKey) renderModalContent(itemId, famKey);
    }

    function toggleSetMode(itemId) {
      var st = getItemState(currentColId, itemId);
      st.isNormal = !st.isNormal;
      saveColState(currentColId);
      render();
      if (activeModalItemId === itemId && activeModalFamily) renderModalContent(itemId, activeModalFamily);
    }

    function openEvoModal(itemId, famKey) {
      activeModalItemId = itemId;
      activeModalFamily = famKey;

    function closeEvoModal() {

    function handleActionTrigger(target, ev) {
      var actionEl = target.closest("[data-action]");
      if (!actionEl) return;
      var action = actionEl.getAttribute("data-action");
      var id = actionEl.getAttribute("data-id");
      var fam = actionEl.getAttribute("data-fam");
      var stage = actionEl.getAttribute("data-stage");

      if (action === "open-col") {
        currentColId = actionEl.getAttribute("data-col");
        filter = "ALL";
        query = "";
        allNormalToggle = false;
        window.scrollTo(0, 0);
        render();
      } else if (action === "go-home") {
        currentColId = null;
        query = "";
        window.scrollTo(0, 0);
        render();
      } else if (action === "set-filter") {
        filter = actionEl.getAttribute("data-z");
        render();
      } else if (action === "global-mode") {
        allNormalToggle = !allNormalToggle;
        var col = getCol(currentColId);
        var list = col.type === "multi-location" ? col.locations : col.roster;
        list.forEach(function(entry) {
          getItemState(currentColId, entry.id).isNormal = allNormalToggle;
        });
        saveColState(currentColId);
        render();
      } else if (action === "quick-toggle") {
        ev.stopPropagation();
        quickToggleFamily(id, fam);
      } else if (action === "open-modal") {
        openEvoModal(id, fam);
      } else if (action === "toggle-mode") {
        ev.stopPropagation();
        toggleSetMode(id);
      } else if (action === "toggle-stage") {
        toggleStageOwn(id, stage);
      } else if (action === "toggle-all-stages") {
        toggleAllStagesInModal(id, fam);
      } else if (action === "close-modal") {
        closeEvoModal();
      }
    }

    document.body.addEventListener("click", function(ev) {
      if (ev.target.id === "evoModal") {
        closeEvoModal();
        return;

          handleActionTrigger(actionEl, ev);
        }
      }
    });

  }

  function closeEvoModal() {
    activeModalId = null;
    activeModalFamily = null;
    document.getElementById("evoModal").classList.remove("show");
  }

  function buildDotsHtml(st, famKey) {
    var fam = FAMILIES[famKey];
    var dots = fam.stages.map(function(p) {
      var shOwned = isStageShinyOwned(st, p.key);
      var cardOwned = isStageCardOwned(st, p.key);
      var cls = !st.isNormal ? (shOwned ? "on-sh" : "") : (shOwned ? "on-sh" : (cardOwned ? "on" : ""));
      return "«span class='evo-dot " + cls + "' title='" + escapeHtml(p.name) + "'»«/span»";
    }).join("");
    return "«span class='evo-dots' aria-hidden='true'»" + dots + "«/span»";
  }

  
  function buildMainCardHtml(loc, famKey, isOwned, unlockedByShinyInNorm, isShiny, dotsHtml) {
    var fam = FAMILIES[famKey];
    var bgUrl = DITTO_BASE + loc.slug + ".png";
    var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«span class='sp3'»✦«/span»«/div»" : "";
    var badgeText = isOwned ? (unlockedByShinyInNorm ? "✨ 色背已連動" : "✓ 已擁有") : "+ 點此打勾";
    var badgeExtraCls = unlockedByShinyInNorm ? "from-shiny" : "";
    var previewLabel = "預覽 " + loc.eng + " " + fam.baseName + " 進化鏈背卡";
    var toggleLabel = "切換 " + loc.eng + " " + (isShiny ? "色背" : "普背") + " " + fam.baseName + " 擁有狀態";

    return [
      "«div class='pogo-card " + (isOwned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "'»",
      "  «div class='bg-layer' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
      sparkleHtml,
      "  «div class='card-top'»",
      "    «span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + (isShiny ? "✨ 色背" : "普背") + "«/span»",
      "    «button type='button' class='own-badge " + badgeExtraCls + "' aria-label='" + escapeHtml(toggleLabel) + "' aria-pressed='" + (isOwned ? "true" : "false") + "' data-action='quick-toggle' data-id='" + escapeHtml(loc.id) + "' data-fam='" + escapeHtml(famKey) + "'»" + badgeText + "«/button»",
      "  «/div»",
      "  «div class='card-preview-trigger' role='button' tabindex='0' aria-label='" + escapeHtml(previewLabel) + "' data-action='open-modal' data-id='" + escapeHtml(loc.id) + "' data-fam='" + escapeHtml(famKey) + "'»",
      "    «div class='poke-layer'»",
             pogoImgHtml(fam.baseDex, isShiny, fam.baseName),
      "    «/div»",
      "    «div class='loc-stamp'»",
      "      «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(fam.baseName) + " " + dotsHtml + "«/div»",
      "      «div class='stamp-pill'»📍 " + escapeHtml(loc.eng) + " • " + escapeHtml(loc.county) + "«/div»",
      "      «div class='evo-hint'»" + escapeHtml(fam.baseName) + " 🧬進化鏈«/div»",
      "    «/div»",
      "  «/div»",
      "«/div»"
    ].join("");
  }

  function renderModalContent(id, famKey) {
    var loc = LOCATIONS.find(function(x) { return x.id === id; });
    if (!loc) return;
    var st = getSetState(id);
    var isShiny = !st.isNormal;
    var fam = FAMILIES[famKey];
    var bgUrl = DITTO_BASE + loc.slug + ".png";
    var allOwned = isFamilyAllOwnedInView(st, famKey, st.isNormal);

    var stageCardsHtml = fam.stages.map(function(p) {
      var shOwned = isStageShinyOwned(st, p.key);
      var owned = isStageOwnedInView(st, p.key, st.isNormal);
      var linkedFromShiny = st.isNormal && shOwned;
      var badgeText = owned ? (linkedFromShiny ? "✨ 色背已連動" : "✓ 已擁有") : "點擊打勾";
      var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«/div»" : "";
      return [
        "«div class='pogo-card " + (owned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "' role='button' tabindex='0' aria-pressed='" + (owned ? "true" : "false") + "' data-action='toggle-stage' data-id='" + escapeHtml(id) + "' data-stage='" + escapeHtml(p.key) + "'»",
        "  «div class='bg-layer' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
        sparkleHtml,
        "  «div class='card-top'»",
        "    «span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + escapeHtml(p.stage) + "«/span»",
        "    «span class='own-badge " + (linkedFromShiny ? "from-shiny" : "") + "'»" + badgeText + "«/span»",
        "  «/div»",
        "  «div class='poke-layer'»",
             pogoImgHtml(p.dex, isShiny, p.name),
        "  «/div»",
        "  «div class='loc-stamp'»",
        "    «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(p.name) + "«/div»",
        "    «div class='stamp-pill'»📍 " + escapeHtml(loc.eng) + "«/div»",
        "  «/div»",
        "«/div»"
      ].join("");
    }).join("");

    var modalBox = document.getElementById("evoModalContent");
    renderTemplate(modalBox, [
      "«div class='modal-head'»",
      "  «div class='modal-title' id='modalTitleText'»",
      "    «span class='set-id'»" + escapeHtml(loc.id) + "«/span» " + escapeHtml(loc.eng) + " (" + escapeHtml(loc.zh) + ") — " + escapeHtml(fam.baseName) + "進化鏈",
      "  «/div»",
      "  «div style='display:flex;gap:8px;'»",
      "    «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(loc.id) + "'»",
             (isShiny ? "🔄 普背" : "✨ 色背"),
      "    «/button»",
      "    «button type='button' class='close-btn' data-action='close-modal'»✕ 關閉«/button»",
      "  «/div»",
      "«/div»",
      "«div class='evo-subbar'»",
      "  «span»" + escapeHtml(fam.label) + "（勾選色背自動連動普背；勾選普背不影響色背）«/span»",
      "  «button type='button' class='check-all-btn' data-action='toggle-all-stages' data-id='" + escapeHtml(loc.id) + "' data-fam='" + escapeHtml(famKey) + "'»",
           (allOwned ? "取消全選此進化鏈" : "✓ 一鍵全勾此進化鏈"),
      "  «/button»",
      "«/div»",
      "«div class='evo-row'»" + stageCardsHtml + "«/div»"
    ].join(""));
    bindImgFallbacks(modalBox);
  }

  function render() {
    var grid = document.getElementById("grid");
    renderTemplate(grid, "");

    var shinyTotal = 0, shinyTCnt = 0, shinyRCnt = 0, cardTotal = 0;

    LOCATIONS.forEach(function(loc) {
      var st = getSetState(loc.id);
      var raidFamKey = ZONE_TO_FAMILY[loc.zone];

      var tShiny = isFamilyOwnedInView(st, "treecko", false);
      var rShiny = isFamilyOwnedInView(st, raidFamKey, false);
      if (tShiny) { shinyTCnt++; shinyTotal++; }
      if (rShiny) { shinyRCnt++; shinyTotal++; }

      var tCard = isFamilyOwnedInView(st, "treecko", true);
      var rCard = isFamilyOwnedInView(st, raidFamKey, true);
      if (tCard) cardTotal++;
      if (rCard) cardTotal++;

      var tOwnedView = isFamilyOwnedInView(st, "treecko", st.isNormal);
      var rOwnedView = isFamilyOwnedInView(st, raidFamKey, st.isNormal);

      var bothDone = tShiny && rShiny;
      if (filter === "MISS" && bothDone) return;
      if (["S","M","N","W"].indexOf(filter) !== -1 && loc.zone !== filter) return;
      var searchable = (loc.id + " " + loc.eng + " " + loc.zh + " " + loc.county).toLowerCase();
      if (query && searchable.indexOf(query) === -1) return;

      var isShiny = !st.isNormal;
      var setBox = document.createElement("div");
      setBox.className = "set-box";

      var tDots = buildDotsHtml(st, "treecko");
      var rDots = buildDotsHtml(st, raidFamKey);

      var cardTreecko = buildMainCardHtml(loc, "treecko", tOwnedView, (st.isNormal && tShiny), isShiny, tDots);
      var cardRaid = buildMainCardHtml(loc, raidFamKey, rOwnedView, (st.isNormal && rShiny), isShiny, rDots);

      renderTemplate(setBox, [
        "«div class='set-header'»",
        "  «div class='set-title-wrap'»",
        "    «div class='set-eng'»«span class='set-id'»" + escapeHtml(loc.id) + "«/span» " + escapeHtml(loc.eng) + "«/div»",
        "    «div class='set-zh'»" + escapeHtml(loc.zh) + " (" + escapeHtml(loc.county) + ")«/div»",
        "  «/div»",
        "  «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(loc.id) + "'»",
             (isShiny ? "🔄 切換普背" : "✨ 切換色背"),
        "  «/button»",
        "«/div»",
        "«div class='pair-grid'»",
        cardTreecko,
        cardRaid,
        "«/div»"
      ].join(""));

      grid.appendChild(setBox);
    });

    bindImgFallbacks(grid);

    document.getElementById("st-loc").textContent = "✨ 色背進度：" + shinyTotal + " / 54 (" + Math.round(shinyTotal / 54 * 100) + "%) ｜ 🎴 背卡收藏：" + cardTotal + " / 54";
    document.getElementById("st-det").textContent = "🌿 色背木守宮 " + shinyTCnt + "/27 ｜ ⚔️ 色背團體戰 " + shinyRCnt + "/27";
    document.getElementById("bar").style.width = (shinyTotal / 54 * 100) + "%";
    document.getElementById("barWrap").setAttribute("aria-valuenow", String(shinyTotal));
  }

  function handleActionTrigger(target, ev) {
    var actionEl = target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    var id = actionEl.getAttribute("data-id");
    var fam = actionEl.getAttribute("data-fam");
    var stage = actionEl.getAttribute("data-stage");

    if (action === "quick-toggle") {
      ev.stopPropagation();
      quickToggleFamily(id, fam);
    } else if (action === "open-modal") {
      openEvoModal(id, fam);
    } else if (action === "toggle-mode") {
      toggleSetMode(id);
    } else if (action === "toggle-stage") {
      toggleStageOwn(id, stage);
    } else if (action === "toggle-all-stages") {
      toggleAllStagesInModal(id, fam);
    } else if (action === "close-modal") {
      closeEvoModal();
    }
  }

  document.body.addEventListener("click", function(ev) {
    if (ev.target.id === "evoModal") {
      closeEvoModal();
      return;
    }
    handleActionTrigger(ev.target, ev);
  });

  document.body.addEventListener("keydown", function(ev) {
    if (ev.key === "Escape" && activeModalId) {
      closeEvoModal();
      return;
    }
    if (ev.key === "Enter" || ev.key === " ") {
      var actionEl = ev.target.closest("[data-action]");
      if (actionEl && actionEl.tagName !== "BUTTON") {
        ev.preventDefault();
        handleActionTrigger(actionEl, ev);
      }
    }
  });

  document.getElementById("q").addEventListener("input", function(e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  var btns = document.querySelectorAll(".btn[data-z]");
  Array.prototype.forEach.call(btns, function(b) {
    b.addEventListener("click", function() {
      Array.prototype.forEach.call(btns, function(x) { x.classList.remove("active"); });
      b.classList.add("active");
      filter = b.getAttribute("data-z");
      render();
    });
  });

  document.getElementById("globalModeBtn").addEventListener("click", function() {
    allNormalToggle = !allNormalToggle;
    LOCATIONS.forEach(function(loc) {
      var st = getSetState(loc.id);
      st.isNormal = allNormalToggle;
    });
    document.getElementById("globalModeBtn").textContent = allNormalToggle ? "✨ 切換色背" : "🔄 切換普背";
    saveState();
    render();
  });

  render();
})();
</script>
