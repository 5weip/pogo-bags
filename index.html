    try {
      localStorage.setItem(CURRENT_KEY, JSON.stringify(state));
    } catch (e) {
      showToast("⚠️ 儲存空間不足或遭封鎖，變更無法保存。");
    }
  }

  function padDexNumber(dex) {
    return String(dex).padStart(3, "0");
  }

  function pogoImgHtml(dex, isShiny, altName) {
    var addrUrl = PM_ADDR_BASE + "pm" + dex + (isShiny ? ".s" : "") + ".icon.png";
    var legacyUrl = PM_ICON_BASE + "pokemon_icon_" + padDexNumber(dex) + "_00" + (isShiny ? "_shiny" : "") + ".png";
    return "«img class='poke-img' src='" + escapeHtml(addrUrl) + "' data-fallback='" + escapeHtml(legacyUrl) + "' alt='" + escapeHtml(altName) + "'»";
  }

  function bindImgFallbacks(container) {
    var imgs = container.querySelectorAll("img.poke-img[data-fallback]");
    Array.prototype.forEach.call(imgs, function(img) {
      img.addEventListener("error", function() {
        var fb = img.getAttribute("data-fallback");
        if (fb && img.src !== fb) img.src = fb;
      }, { once: true });
    });
  }

  function quickToggleFamily(id, famKey) {
    var st = getSetState(id);
    var fam = FAMILIES[famKey];
    if (!st.isNormal) {
      var anyShiny = isFamilyOwnedInView(st, famKey, false);
      if (anyShiny) {
        fam.stages.forEach(function(p) { st[p.key] = false; });
      } else {
        st[fam.stages[0].key] = true;
      }
    } else {
      if (isFamilyOwnedInView(st, famKey, false)) {
        warnLockedByShiny();
        return;
      }
      var anyNorm = isFamilyOwnedInView(st, famKey, true);
      if (anyNorm) {
        fam.stages.forEach(function(p) { st["n_" + p.key] = false; });
      } else {
        st["n_" + fam.stages[0].key] = true;
      }
    }
    saveState();
    render();
  }

  function toggleAllStagesInModal(id, famKey) {
    var st = getSetState(id);
    var fam = FAMILIES[famKey];
    var all = isFamilyAllOwnedInView(st, famKey, st.isNormal);
    if (!st.isNormal) {
      fam.stages.forEach(function(p) { st[p.key] = !all; });
    } else {
      if (all && isFamilyOwnedInView(st, famKey, false)) {
        warnLockedByShiny();
      }
      fam.stages.forEach(function(p) { st["n_" + p.key] = !all; });
    }
    saveState();
    render();
    if (activeModalId === id && activeModalFamily === famKey) renderModalContent(id, famKey);
  }

  function toggleStageOwn(id, baseKey) {
    var st = getSetState(id);
    if (!st.isNormal) {
      st[baseKey] = !st[baseKey];
    } else {
      if (st[baseKey]) {
        warnLockedByShiny();
        return;
      }
      var nk = "n_" + baseKey;
      st[nk] = !st[nk];
    }
    saveState();
    render();
    if (activeModalId === id && activeModalFamily) renderModalContent(id, activeModalFamily);
  }

  function toggleSetMode(id) {
    var st = getSetState(id);
    st.isNormal = !st.isNormal;
    saveState();
    render();
    if (activeModalId === id && activeModalFamily) renderModalContent(id, activeModalFamily);
  }

  function openEvoModal(id, famKey) {
    activeModalId = id;
    activeModalFamily = famKey;
    renderModalContent(id, famKey);
    document.getElementById("evoModal").classList.add("show");
  }

  function closeEvoModal() {
    activeModalId = null;
    activeModalFamily = null;
    document.getElementById("evoModal").classList.remove("show");
  }

  function buildDotsHtml(st, famKey) {
    var fam = FAMILIES[famKey];
    var dots = fam.stages.map(function(p) {
      var shOwned = isStageShinyOwned(st, p.key);
      var cardOwned = isStageCardOwned(st, p.key);
      var cls = !st.isNormal ? (shOwned ? "on-sh" : "") : (shOwned ? "on-sh" : (cardOwned ? "on" : ""));
      return "«span class='evo-dot " + cls + "' title='" + escapeHtml(p.name) + "'»«/span»";
    }).join("");
    return "«span class='evo-dots' aria-hidden='true'»" + dots + "«/span»";
  }

  
  function buildMainCardHtml(loc, famKey, isOwned, unlockedByShinyInNorm, isShiny, dotsHtml) {
    var fam = FAMILIES[famKey];
    var bgUrl = DITTO_BASE + loc.slug + ".png";
    var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«span class='sp3'»✦«/span»«/div»" : "";
    var badgeText = isOwned ? (unlockedByShinyInNorm ? "✨ 色背已連動" : "✓ 已擁有") : "+ 點此打勾";
    var badgeExtraCls = unlockedByShinyInNorm ? "from-shiny" : "";
    var previewLabel = "預覽 " + loc.eng + " " + fam.baseName + " 進化鏈背卡";
    var toggleLabel = "切換 " + loc.eng + " " + (isShiny ? "色背" : "普背") + " " + fam.baseName + " 擁有狀態";

    return [
      "«div class='pogo-card " + (isOwned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "'»",
      "  «div class='bg-layer' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
      sparkleHtml,
      "  «div class='card-top'»",
      "    «span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + (isShiny ? "✨ 色背" : "普背") + "«/span»",
      "    «button type='button' class='own-badge " + badgeExtraCls + "' aria-label='" + escapeHtml(toggleLabel) + "' aria-pressed='" + (isOwned ? "true" : "false") + "' data-action='quick-toggle' data-id='" + escapeHtml(loc.id) + "' data-fam='" + escapeHtml(famKey) + "'»" + badgeText + "«/button»",
      "  «/div»",
      "  «div class='card-preview-trigger' role='button' tabindex='0' aria-label='" + escapeHtml(previewLabel) + "' data-action='open-modal' data-id='" + escapeHtml(loc.id) + "' data-fam='" + escapeHtml(famKey) + "'»",
      "    «div class='poke-layer'»",
             pogoImgHtml(fam.baseDex, isShiny, fam.baseName),
      "    «/div»",
      "    «div class='loc-stamp'»",
      "      «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(fam.baseName) + " " + dotsHtml + "«/div»",
      "      «div class='stamp-pill'»📍 " + escapeHtml(loc.eng) + " • " + escapeHtml(loc.county) + "«/div»",
      "      «div class='evo-hint'»" + escapeHtml(fam.baseName) + " 🧬進化鏈«/div»",
      "    «/div»",
      "  «/div»",
      "«/div»"
    ].join("");
  }

  function renderModalContent(id, famKey) {
    var loc = LOCATIONS.find(function(x) { return x.id === id; });
    if (!loc) return;
    var st = getSetState(id);
    var isShiny = !st.isNormal;
    var fam = FAMILIES[famKey];
    var bgUrl = DITTO_BASE + loc.slug + ".png";
    var allOwned = isFamilyAllOwnedInView(st, famKey, st.isNormal);

    var stageCardsHtml = fam.stages.map(function(p) {
      var shOwned = isStageShinyOwned(st, p.key);
      var owned = isStageOwnedInView(st, p.key, st.isNormal);
      var linkedFromShiny = st.isNormal && shOwned;
      var badgeText = owned ? (linkedFromShiny ? "✨ 色背已連動" : "✓ 已擁有") : "點擊打勾";
      var sparkleHtml = isShiny ? "«div class='sparkles' aria-hidden='true'»«span class='sp1'»✨«/span»«span class='sp2'»✨«/span»«/div»" : "";
      return [
        "«div class='pogo-card " + (owned ? "owned " : "locked ") + (isShiny ? "is-shiny" : "") + "' role='button' tabindex='0' aria-pressed='" + (owned ? "true" : "false") + "' data-action='toggle-stage' data-id='" + escapeHtml(id) + "' data-stage='" + escapeHtml(p.key) + "'»",
        "  «div class='bg-layer' style=\"background-image:url('" + escapeHtml(bgUrl) + "');\"»«/div»",
        sparkleHtml,
        "  «div class='card-top'»",
        "    «span class='ver-tag " + (isShiny ? "" : "norm") + "'»" + escapeHtml(p.stage) + "«/span»",
        "    «span class='own-badge " + (linkedFromShiny ? "from-shiny" : "") + "'»" + badgeText + "«/span»",
        "  «/div»",
        "  «div class='poke-layer'»",
             pogoImgHtml(p.dex, isShiny, p.name),
        "  «/div»",
        "  «div class='loc-stamp'»",
        "    «div class='poke-name'»" + (isShiny ? "✨ " : "") + escapeHtml(p.name) + "«/div»",
        "    «div class='stamp-pill'»📍 " + escapeHtml(loc.eng) + "«/div»",
        "  «/div»",
        "«/div»"
      ].join("");
    }).join("");

    var modalBox = document.getElementById("evoModalContent");
    renderTemplate(modalBox, [
      "«div class='modal-head'»",
      "  «div class='modal-title' id='modalTitleText'»",
      "    «span class='set-id'»" + escapeHtml(loc.id) + "«/span» " + escapeHtml(loc.eng) + " (" + escapeHtml(loc.zh) + ") — " + escapeHtml(fam.baseName) + "進化鏈",
      "  «/div»",
      "  «div style='display:flex;gap:8px;'»",
      "    «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(loc.id) + "'»",
             (isShiny ? "🔄 普背" : "✨ 色背"),
      "    «/button»",
      "    «button type='button' class='close-btn' data-action='close-modal'»✕ 關閉«/button»",
      "  «/div»",
      "«/div»",
      "«div class='evo-subbar'»",
      "  «span»" + escapeHtml(fam.label) + "（勾選色背自動連動普背；勾選普背不影響色背）«/span»",
      "  «button type='button' class='check-all-btn' data-action='toggle-all-stages' data-id='" + escapeHtml(loc.id) + "' data-fam='" + escapeHtml(famKey) + "'»",
           (allOwned ? "取消全選此進化鏈" : "✓ 一鍵全勾此進化鏈"),
      "  «/button»",
      "«/div»",
      "«div class='evo-row'»" + stageCardsHtml + "«/div»"
    ].join(""));
    bindImgFallbacks(modalBox);
  }

  function render() {
    var grid = document.getElementById("grid");
    renderTemplate(grid, "");

    var shinyTotal = 0, shinyTCnt = 0, shinyRCnt = 0, cardTotal = 0;

    LOCATIONS.forEach(function(loc) {
      var st = getSetState(loc.id);
      var raidFamKey = ZONE_TO_FAMILY[loc.zone];

      var tShiny = isFamilyOwnedInView(st, "treecko", false);
      var rShiny = isFamilyOwnedInView(st, raidFamKey, false);
      if (tShiny) { shinyTCnt++; shinyTotal++; }
      if (rShiny) { shinyRCnt++; shinyTotal++; }

      var tCard = isFamilyOwnedInView(st, "treecko", true);
      var rCard = isFamilyOwnedInView(st, raidFamKey, true);
      if (tCard) cardTotal++;
      if (rCard) cardTotal++;

      var tOwnedView = isFamilyOwnedInView(st, "treecko", st.isNormal);
      var rOwnedView = isFamilyOwnedInView(st, raidFamKey, st.isNormal);

      var bothDone = tShiny && rShiny;
      if (filter === "MISS" && bothDone) return;
      if (["S","M","N","W"].indexOf(filter) !== -1 && loc.zone !== filter) return;
      var searchable = (loc.id + " " + loc.eng + " " + loc.zh + " " + loc.county).toLowerCase();
      if (query && searchable.indexOf(query) === -1) return;

      var isShiny = !st.isNormal;
      var setBox = document.createElement("div");
      setBox.className = "set-box";

      var tDots = buildDotsHtml(st, "treecko");
      var rDots = buildDotsHtml(st, raidFamKey);

      var cardTreecko = buildMainCardHtml(loc, "treecko", tOwnedView, (st.isNormal && tShiny), isShiny, tDots);
      var cardRaid = buildMainCardHtml(loc, raidFamKey, rOwnedView, (st.isNormal && rShiny), isShiny, rDots);

      renderTemplate(setBox, [
        "«div class='set-header'»",
        "  «div class='set-title-wrap'»",
        "    «div class='set-eng'»«span class='set-id'»" + escapeHtml(loc.id) + "«/span» " + escapeHtml(loc.eng) + "«/div»",
        "    «div class='set-zh'»" + escapeHtml(loc.zh) + " (" + escapeHtml(loc.county) + ")«/div»",
        "  «/div»",
        "  «button type='button' class='mode-btn " + (isShiny ? "" : "normal-mode") + "' data-action='toggle-mode' data-id='" + escapeHtml(loc.id) + "'»",
             (isShiny ? "🔄 切換普背" : "✨ 切換色背"),
        "  «/button»",
        "«/div»",
        "«div class='pair-grid'»",
        cardTreecko,
        cardRaid,
        "«/div»"
      ].join(""));

      grid.appendChild(setBox);
    });

    bindImgFallbacks(grid);

    document.getElementById("st-loc").textContent = "✨ 色背進度：" + shinyTotal + " / 54 (" + Math.round(shinyTotal / 54 * 100) + "%) ｜ 🎴 背卡收藏：" + cardTotal + " / 54";
    document.getElementById("st-det").textContent = "🌿 色背木守宮 " + shinyTCnt + "/27 ｜ ⚔️ 色背團體戰 " + shinyRCnt + "/27";
    document.getElementById("bar").style.width = (shinyTotal / 54 * 100) + "%";
    document.getElementById("barWrap").setAttribute("aria-valuenow", String(shinyTotal));
  }

  function handleActionTrigger(target, ev) {
    var actionEl = target.closest("[data-action]");
    if (!actionEl) return;
    var action = actionEl.getAttribute("data-action");
    var id = actionEl.getAttribute("data-id");
    var fam = actionEl.getAttribute("data-fam");
    var stage = actionEl.getAttribute("data-stage");

    if (action === "quick-toggle") {
      ev.stopPropagation();
      quickToggleFamily(id, fam);
    } else if (action === "open-modal") {
      openEvoModal(id, fam);
    } else if (action === "toggle-mode") {
      toggleSetMode(id);
    } else if (action === "toggle-stage") {
      toggleStageOwn(id, stage);
    } else if (action === "toggle-all-stages") {
      toggleAllStagesInModal(id, fam);
    } else if (action === "close-modal") {
      closeEvoModal();
    }
  }

  document.body.addEventListener("click", function(ev) {
    if (ev.target.id === "evoModal") {
      closeEvoModal();
      return;
    }
    handleActionTrigger(ev.target, ev);
  });

  document.body.addEventListener("keydown", function(ev) {
    if (ev.key === "Escape" && activeModalId) {
      closeEvoModal();
      return;
    }
    if (ev.key === "Enter" || ev.key === " ") {
      var actionEl = ev.target.closest("[data-action]");
      if (actionEl && actionEl.tagName !== "BUTTON") {
        ev.preventDefault();
        handleActionTrigger(actionEl, ev);
      }
    }
  });

  document.getElementById("q").addEventListener("input", function(e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  var btns = document.querySelectorAll(".btn[data-z]");
  Array.prototype.forEach.call(btns, function(b) {
    b.addEventListener("click", function() {
      Array.prototype.forEach.call(btns, function(x) { x.classList.remove("active"); });
      b.classList.add("active");
      filter = b.getAttribute("data-z");
      render();
    });
  });

  document.getElementById("globalModeBtn").addEventListener("click", function() {
    allNormalToggle = !allNormalToggle;
    LOCATIONS.forEach(function(loc) {
      var st = getSetState(loc.id);
      st.isNormal = allNormalToggle;
    });
    document.getElementById("globalModeBtn").textContent = allNormalToggle ? "✨ 切換色背" : "🔄 切換普背";
    saveState();
    render();
  });

  render();
})();
</script>
